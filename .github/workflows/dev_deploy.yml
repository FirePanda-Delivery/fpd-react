# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "dev" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v1
        with:
          node-version: 21.7.3

      - name: Build
        run: |
         npm install
         npm run build


  prepare-environment:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Stop container
        run: docker stop fpd-ui || true

      - name: Remove container and image
        run: docker rm fpd-ui || true && docker rmi fpd-ui || true


  deploy:
    runs-on: self-hosted
    needs: prepare-environment
    steps:
      - name: docker build
        run: docker build ./ -t fpd-ui
      - name: run image
        run: docker run -d -p 80:80 --name fpd-ui fpd-ui
